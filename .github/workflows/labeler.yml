name: Label risky PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads only the changed-file list; never checks out or runs PR code.
      - uses: actions/labeler@v7
        with:
          sync-labels: false
