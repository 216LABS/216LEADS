name: Weekly database backup

# Off-site copy on top of Supabase Pro's daily backups (DevOps addendum D4): a pg_dump of
# production, encrypted with BACKUP_ENCRYPTION_KEY, kept as a workflow artifact for 30 days.
# Restore: see docs/ROLLBACK.md.
on:
  schedule:
    - cron: "0 7 * * 0" # Sundays 07:00 UTC (02:00/03:00 ET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check secrets
        id: check
        env:
          DB: ${{ secrets.PRODUCTION_DATABASE_URL }}
          KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DB" ] || [ -z "$KEY" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL / BACKUP_ENCRYPTION_KEY not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pg_dump 17
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        if: steps.check.outputs.skip != 'true'
        env:
          DB: ${{ secrets.PRODUCTION_DATABASE_URL }}
          KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          name="216leads-prod-$(date -u +%Y%m%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth "$DB" > "$name"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in "$name" -out "$name.enc"
          rm "$name"
          echo "FILE=$name.enc" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: db-backup
          path: ${{ env.FILE }}
          retention-days: 30
