name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build, typecheck, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-status "$base"...HEAD -- packages/db/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Merged migrations must not be edited or deleted; add a new migration instead (docs/ROLLBACK.md):"
            echo "$changed"; exit 1
          fi
          for f in $(git diff --name-only --diff-filter=A "$base"...HEAD -- packages/db/migrations); do
            if grep -Eiq 'drop[[:space:]]+(column|table)' "$f"; then
              echo "::warning file=$f::Destructive migration. Ship it only after a release that stopped using it (docs/ROLLBACK.md)."
            fi
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @216leads/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      - run: pnpm typecheck
      - name: Migrations on a throwaway Postgres + PostGIS, then real-data fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/ci/auth-stub.sql
          pnpm db:migrate
          pnpm db:seed
      - name: Integration tests
        run: pnpm test:integration
      - name: Dependency audit (warn only)
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported high-severity advisories"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The open-source binary via its official image (gitleaks-action needs a paid license on org repos).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --exit-code 1

  smoke:
    name: Smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase, migrations and fixtures
        run: node scripts/local.mjs --no-dev
      - name: QA orgs and login
        run: pnpm seed:staging
      - name: Build and start the app
        # Production layout: served under the /homesignal base path (#42).
        env:
          NEXT_PUBLIC_BASE_PATH: /homesignal
        run: |
          pnpm --filter @216leads/web build
          (pnpm --filter @216leads/web start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/homesignal/login && exit 0; sleep 2; done
          cat /tmp/web.log; exit 1
      - name: Playwright
        run: |
          pnpm --filter @216leads/web exec playwright install --with-deps chromium
          pnpm --filter @216leads/web test:e2e
        env:
          # Point at a Vercel preview once previews exist (repository variable E2E_BASE_URL).
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:3000/homesignal/' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
