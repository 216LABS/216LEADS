name: Feature
description: New behavior or a change to existing behavior.
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who it is for and what it lets them do, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The PR's "How to test" should walk through each one.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec section
      description: e.g. BUILD_SPEC 9.4, ADDENDUM_PROFILE_WIZARD A4, ADDENDUM_DEVOPS D3
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3]
