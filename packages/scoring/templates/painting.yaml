key: painting
version: 1
label: Painting
threshold: 55
signals:
  era_pre1950: { weight: 20 }
  survey_condition:paint_peeling: { weight: 15 }
  survey_condition:siding: { weight: 10 }
  new_owner: { weight: 20 }
  active_violation:painting: { weight: 20 }
  no_recent_permit:painting: { weight: 15 }
triggers:
  - { kind: sale, within_days: 30, boost: 10, label: "Just sold" }
  - { kind: violation, category: painting, within_days: 90, boost: 12, label: "City paint citation" }
  - { kind: permit, category: siding, within_days: 90, boost: 8, label: "New siding permit" }
  - { kind: permit, category: windows, within_days: 90, boost: 6, label: "New windows permit" }
  - { kind: permit, category: remodel, within_days: 90, boost: 6, label: "Remodel underway" }
sliders:
  - { key: survey_condition:paint_peeling, label: "Peeling paint" }
  - { key: era_pre1950, label: "Older homes (pre-1950)" }
  - { key: new_owner, label: "Just moved in" }
default_filters: { owner_occupied: true }
default_exclusions: { rentals: false, condos: true, condemned: true }
pitch: "Built {year_built}. {top_reason}. A fresh coat before the trim rots is an easy yes."
