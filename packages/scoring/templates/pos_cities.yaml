# Point-of-sale (POS) inspection cities (issue #11). A home that just sold in one of these had a
# city inspection at sale, which tends to flag roof, masonry, electrical, plumbing, gutters and
# driveways (HVAC is not on the report's list).
# source: Akron Cleveland Association of REALTORS (ACAR), Point-of-Sale Final Report, Feb 2025, Table 1.
# `municipality` is the name used in our parcel data (Cuyahoga tax district, Lake G_COMM, Summit
# permit-page town). `in_data: false` marks cities whose homes we don't have yet: Twinsburg (city)
# and Macedonia run their own building departments, so Summit County's permit list doesn't cover
# them ("TWINSBURG TWP" is a different jurisdiction and is deliberately not mapped).
source: "ACAR Point-of-Sale Final Report (Feb 2025), Table 1"
