key: lawn_care
version: 1
label: Lawn care
threshold: 55
signals:
  grass: { weight: 30 }
  lot_size: { weight: 25 }
  new_owner: { weight: 20 }
  price_band: { weight: 15 }
  owner_occupied: { weight: 10 }
triggers:
  - { kind: sale, within_days: 30, boost: 10, label: "Just sold" }
sliders:
  - { key: grass, label: "Lawn area" }
  - { key: lot_size, label: "Lot size" }
  - { key: new_owner, label: "Just moved in" }
default_filters: { lot_acres_min: 0.15, owner_occupied: true }
default_exclusions: { rentals: true, condos: true, condemned: true }
pitch: "{top_reason}. First mow free for new neighbors is an easy yes."
